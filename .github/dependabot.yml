version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      development:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      time: "06:00"
      timezone: Etc/UTC
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(ci)"
    # Keep init and analyze on one SHA: mixing majors across the two steps breaks
    # CodeQL analysis (they must share their library/cache format).
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/init"
          - "github/codeql-action/analyze"
