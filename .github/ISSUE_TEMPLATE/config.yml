blank_issues_enabled: false
contact_links:
  - name: Usage question or design discussion
    url: https://github.com/RickyHolland/pi-rcompact/discussions
    about: Ask how something is meant to work, or discuss an approach before writing code.
  - name: Report a vulnerability privately
    url: https://github.com/RickyHolland/pi-rcompact/security/advisories/new
    about: Redaction bypasses, transcript exposure, or anything you would rather not post publicly. See SECURITY.md.
  - name: Pi (the host) issues
    url: https://github.com/earendil-works/pi
    about: Bugs in Pi itself belong upstream — but open one here too if rcompact should be working around it.
